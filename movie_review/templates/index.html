<!DOCTYPE html>
<html>
<head>
    <title>IMDb Sentiment Analysis</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>IMDb Sentiment Analyzer</h1>

        <p>Enter your movie review below</p>

        <form method="POST">

            <textarea
                name="review"
                placeholder="Write your movie review..."
                required>{{ review }}</textarea>

            <button type="submit">Analyze Sentiment</button>

        </form>

        {% if prediction %}
        <div class="result">
            <h2>Prediction: {{ prediction }}</h2>
        </div>
        {% endif %}

    </div>

</body>
</html>
